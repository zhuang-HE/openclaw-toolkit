# 无人机数据收集 - Crontab 定时任务配置
# 安装方法：crontab /home/admin/.openclaw/workspace/scripts/drone_collection_cron.conf

# 环境变量
SHELL=/bin/bash
PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/python3/bin
PYTHON=/usr/bin/python3
WORKSPACE=/home/admin/.openclaw/workspace

# ==================== 定时任务 ====================

# 每月最后一天 23:00 执行数据收集（月度更新）
# 注意：crontab 不直接支持"每月最后一天"，这里使用 28-31 日检查的方式
# 更精确的方式是在脚本中判断日期

0 23 28-31 * * [ "$(date -d tomorrow +%d)" = "01" ] && cd $WORKSPACE && bash $WORKSPACE/scripts/run_drone_collection.sh >> $WORKSPACE/logs/cron_drone_collection.log 2>&1

# 简化版本：每月 28 日执行（确保在所有月份都执行）
0 23 28 * * cd $WORKSPACE && bash $WORKSPACE/scripts/run_drone_collection.sh >> $WORKSPACE/logs/cron_drone_collection.log 2>&1

# 货运无人机数据收集：每月 28 日 23:30 执行（消费级无人机后 30 分钟）
0 23 28 * * cd $WORKSPACE && $PYTHON $WORKSPACE/scripts/货运无人机数据收集自动化.py >> $WORKSPACE/logs/cron_cargo_drone_collection.log 2>&1

# ==================== 说明 ====================
# 
# 安装定时任务：
#   crontab /home/admin/.openclaw/workspace/scripts/drone_collection_cron.conf
#
# 查看已安装的定时任务：
#   crontab -l
#
# 编辑定时任务：
#   crontab -e
#
# 删除定时任务：
#   crontab -r
#
# 查看 cron 日志：
#   tail -f /var/log/cron
#   或
#   journalctl -u cron -f
#
# ==================== 测试 ====================
#
# 手动执行数据收集：
#   bash /home/admin/.openclaw/workspace/scripts/run_drone_collection.sh
#
# 查看日志：
#   tail -f /home/admin/.openclaw/workspace/logs/无人机数据收集_自动化.log
#
# ====================
