# 临床试验数据收集 - Crontab 定时任务配置
# 安装方法：crontab /home/admin/.openclaw/workspace/scripts/clinical_trial_cron.conf

# 环境变量
SHELL=/bin/bash
PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/python3/bin
PYTHON=/usr/bin/python3
WORKSPACE=/home/admin/.openclaw/workspace

# ==================== 定时任务 ====================

# 每月 1 日 02:00 执行数据收集（月度更新）
0 2 1 * * cd $WORKSPACE && bash $WORKSPACE/scripts/run_clinical_trial_collection.sh >> $WORKSPACE/logs/cron_clinical_trial_collection.log 2>&1

# ==================== 说明 ====================
# 
# 安装定时任务：
#   crontab /home/admin/.openclaw/workspace/scripts/clinical_trial_cron.conf
#
# 查看已安装的定时任务：
#   crontab -l
#
# 编辑定时任务：
#   crontab -e
#
# 删除定时任务：
#   crontab -r
#
# 查看 cron 日志：
#   tail -f /var/log/cron
#   或
#   journalctl -u cron -f
#
# ==================== 测试 ====================
#
# 手动执行数据收集：
#   bash /home/admin/.openclaw/workspace/scripts/run_clinical_trial_collection.sh
#
# 查看日志：
#   tail -f /home/admin/.openclaw/workspace/logs/临床试验数据收集_自动化.log
#
# ====================
