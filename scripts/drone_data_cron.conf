# 无人机 BI 数据库月度数据收集 - Cron 定时任务配置
# 执行时间：每月最后一天 23:00

# 环境变量
SHELL=/bin/bash
PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
PYTHONPATH=/home/admin/.openclaw/workspace

# 月度数据收集任务（每月最后一天 23:00 执行）
0 23 28-31 * * [ "$(date -d tomorrow +\%d)" = "01" ] && /usr/bin/python3 /home/admin/.openclaw/workspace/scripts/无人机数据月度收集.py >> /home/admin/.openclaw/workspace/logs/无人机数据收集.log 2>&1

# 备用：每月 1 日凌晨 1:00 执行（如果上月最后一天失败）
0 1 1 * * /usr/bin/python3 /home/admin/.openclaw/workspace/scripts/无人机数据月度收集.py >> /home/admin/.openclaw/workspace/logs/无人机数据收集.log 2>&1

# 季度数据汇总（每季度第一个月 5 日 2:00）
0 2 5 1,4,7,10 * /usr/bin/python3 /home/admin/.openclaw/workspace/scripts/无人机数据季度汇总.py >> /home/admin/.openclaw/workspace/logs/无人机季度汇总.log 2>&1
