# 机器人数据收集 - Crontab 定时任务配置
# 安装方法：crontab /home/admin/.openclaw/workspace/scripts/robot_collection_cron.conf

# 环境变量
SHELL=/bin/bash
PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/python3/bin
PYTHON=/usr/bin/python3
WORKSPACE=/home/admin/.openclaw/workspace

# ==================== 定时任务 ====================

# 每天 9:00 执行数据收集
0 9 * * * cd $WORKSPACE && bash $WORKSPACE/scripts/run_robot_collection.sh >> $WORKSPACE/logs/cron_robot_collection.log 2>&1

# 每天 20:00 生成并推送日报
0 20 * * * cd $WORKSPACE && bash $WORKSPACE/scripts/push_daily_report.sh >> $WORKSPACE/logs/cron_daily_report.log 2>&1

# ==================== 说明 ====================
# 
# 安装定时任务：
#   crontab /home/admin/.openclaw/workspace/scripts/robot_collection_cron.conf
#
# 查看已安装的定时任务：
#   crontab -l
#
# 编辑定时任务：
#   crontab -e
#
# 删除定时任务：
#   crontab -r
#
# 查看 cron 日志：
#   tail -f /var/log/cron
#   或
#   journalctl -u cron -f
#
# ==================== 测试 ====================
#
# 手动执行数据收集：
#   bash /home/admin/.openclaw/workspace/scripts/run_robot_collection.sh
#
# 手动执行日报推送：
#   bash /home/admin/.openclaw/workspace/scripts/push_daily_report.sh
#
# ====================
