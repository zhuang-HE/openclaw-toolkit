# Token 统计 Cron 定时任务配置

# 环境变量
SHELL=/bin/bash
PATH=/usr/local/bin:/usr/bin:/bin:/usr/local/python3/bin
PYTHON=/usr/bin/python3
WORKSPACE=/home/admin/.openclaw/workspace

# ==================== 定时任务 ====================

# 每天 0:00 发送前一天的 Token 消耗日报
0 0 * * * cd $WORKSPACE && $PYTHON $WORKSPACE/scripts/token_tracker.py send >> $WORKSPACE/logs/cron_token_report.log 2>&1

# 每次对话后自动更新统计（由应用调用，不在此配置）
# 调用方式：python3 scripts/token_tracker.py update <input_tokens> <output_tokens>

# ==================== 说明 ====================

# 安装定时任务：
#   crontab /home/admin/.openclaw/workspace/scripts/token_cron.conf

# 查看已安装的定时任务：
#   crontab -l

# 查看 Token 报告日志：
#   tail -f /home/admin/.openclaw/workspace/logs/cron_token_report.log

# 手动发送日报：
#   python3 /home/admin/.openclaw/workspace/scripts/token_tracker.py send

# 查看当前统计：
#   python3 /home/admin/.openclaw/workspace/scripts/token_tracker.py show

# ====================
