name: Release & Publish to ClawHub

on:
  push:
    tags:
      - 'v*.*.*'

  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 1.1.0）'
        required: true
        type: string

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        run: |
          # Tag push: GITHUB_REF = refs/tags/v1.2.3
          # Workflow dispatch: inputs.version
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: $VERSION"

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --oneline -20 --no-walk --sorted=format:"%s" | head -15 | sed 's/^/• /')
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: OpenClaw Toolkit v${{ steps.version.outputs.version }}
          body: |
            ## OpenClaw Toolkit v${{ steps.version.outputs.version }}

            ### 主要变更
            ${{ steps.changelog.outputs.changelog }}

            ### 安装方式
            ```bash
            clawhub install zhuang-HE/openclaw-toolkit
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-clawhub:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: release
    environment: clawhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub package publish . \
            --source-repo zhuang-HE/openclaw-toolkit \
            --source-ref main \
            --family bundle-plugin \
            --name openclaw-toolkit \
            --version "${VERSION#v}" \
            --display-name "OpenClaw Toolkit - AI助手增强工具包" \
            --changelog "Release v${VERSION}" \
            --host-targets openclaw
