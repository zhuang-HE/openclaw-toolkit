name: Release & Publish to ClawHub

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Get version from tag
        id: version
        run: |
          # 从 GITHUB_REF 提取标签名称（格式：refs/tags/v1.2.3）
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "Using tag: ${TAG_NAME}"

      - name: Generate changelog
        id: changelog
        run: |
          CHANGELOG=$(git log --oneline -20 | head -15 | sed 's/^/• /')
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: OpenClaw Toolkit v${{ steps.version.outputs.tag_name }}
          body: |
            ## OpenClaw Toolkit v${{ steps.version.outputs.tag_name }}

            ### 主要变更
            ${{ steps.changelog.outputs.changelog }}

            ### 安装方式
            ```bash
            clawhub install zhuang-HE/openclaw-toolkit
            ```
          draft: false
          prerelease: false

  publish-clawhub:
    name: Publish to ClawHub
    runs-on: ubuntu-latest
    needs: release
    environment: clawhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Publish to ClawHub
        env:
          CLAWHUB_TOKEN: ${{ secrets.CLAWHUB_TOKEN }}
        run: |
          VERSION="${{ needs.release.outputs.tag_name }}"
          echo "Publishing version: ${VERSION}"
          
          clawhub login --token "$CLAWHUB_TOKEN"
          clawhub package publish . \
            --source-repo zhuang-HE/openclaw-toolkit \
            --source-ref main \
            --family bundle-plugin \
            --name openclaw-toolkit \
            --version "${VERSION#v}" \
            --display-name "OpenClaw Toolkit - AI助手增强工具包" \
            --changelog "Release v${VERSION}" \
            --host-targets openclaw