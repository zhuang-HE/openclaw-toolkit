name: Issue Auto-Labeler

on:
  issues:
    types: [opened, edited]

  # 也支持 Discussion
  discussion:
    types: [opened, edited]

jobs:
  label-issues:
    name: Auto-label issues
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Auto-label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const title = (issue.title || '').toLowerCase();
            const body = (issue.body || '').toLowerCase();
            const labels = [];

            if (title.includes('[bug]') || body.includes('bug report')) {
              labels.push('bug');
            } else if (title.includes('[feature]') || body.includes('feature request')) {
              labels.push('enhancement');
            } else if (title.includes('[feedback]') || body.includes('使用反馈')) {
              labels.push('feedback');
            }

            // 自动添加 priority 标签
            if (body.includes('critical') || body.includes('严重')) {
              labels.push('priority: critical');
            } else if (body.includes('important') || body.includes('重要')) {
              labels.push('priority: high');
            }

            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: labels
              });
            }
